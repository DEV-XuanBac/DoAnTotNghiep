name: hanziilearnapp
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.5+1

  # Firebase
  firebase_core: ^4.5.0
  cloud_firestore: ^6.1.3
  firebase_auth: ^6.2.0

  # UI
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  curved_navigation_bar: ^1.0.6
  carousel_slider: ^5.1.2

  # Translation & Pinyin
  translator: ^1.0.4+1
  lpinyin: ^2.0.3

  # Speech & Audio
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5
  audioplayers: ^6.5.0

  # AI
  google_generative_ai: ^0.4.6

  # OCR & Image
  google_mlkit_text_recognition: ^0.15.1
  image_picker: ^1.2.1

  # Database & Storage
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/iconic/
    - assets/illusimg/
    - lib/core/database_cn_pinyin_vie/dictionary.db
    - lib/core/database_cn_pinyin_vie/HSK_Words.json
    - lib/core/database_HSK_Exam/
    - lib/core/database_HSK_Exam/HSK1/H10901_DeThi1.json
    - lib/core/database_HSK_Exam/HSK1/H10901_listening.mp3